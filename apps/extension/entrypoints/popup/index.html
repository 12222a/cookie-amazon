<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SellerSprite MCP 连接器</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <h1>SellerSprite MCP 连接器</h1>
      <p id="version"></p>
      <p id="mcp-status" role="status" aria-live="polite">正在读取连接状态…</p>
      <p class="hint">配置密钥后，浏览器启动、插件重载或本机服务恢复时都会自动连接。</p>
      <a href="https://www.sellersprite.com" target="_blank" rel="noopener noreferrer">打开卖家精灵并登录</a>
      <p class="hint">请在浏览器打开的卖家精灵网站内登录。</p>
      <details>
        <summary>一次性密钥设置</summary>
        <form id="mcp-token-form">
          <label for="mcp-token">本机 MCP 服务密钥</label>
          <input id="mcp-token" type="password" required minlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="mcp-token-hint" placeholder="粘贴 MCP 配置中的密钥" />
          <p id="mcp-token-hint" class="hint">至少 32 个字符，保存在当前浏览器的扩展存储中。已配置后无需重复填写；更换密钥时重新保存即可。</p>
          <button id="save-mcp-token" type="submit">保存密钥</button>
          <p id="mcp-token-status" role="status" aria-live="polite"></p>
        </form>
      </details>
    </main>
  </body>
</html>
