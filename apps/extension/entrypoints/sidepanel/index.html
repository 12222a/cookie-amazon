<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选品面板</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="panel">
      <header class="panel-head">
        <h1>选品面板</h1>
        <p id="source" class="panel-source"></p>
        <p id="viewer" class="panel-viewer"></p>
        <button id="viewer-clear" type="button" hidden>更换密钥</button>
      </header>

      <section id="identity" class="panel-identity" hidden>
        <p class="panel-hint">填入管理员发给你的访问密钥：研究记录的归属与小组由服务端按密钥确定，客户端说了不算。</p>
        <form id="identity-form" class="panel-identity-form">
          <label for="viewer-name">访问密钥</label>
          <input id="viewer-name" name="token" type="password" maxlength="512" autocomplete="off" placeholder="粘贴访问密钥" />
          <button id="identity-submit" type="submit">保存密钥</button>
          <p id="identity-error" class="panel-error" role="alert" hidden></p>
        </form>
      </section>

      <section id="empty" class="panel-empty" hidden>
        <p>还没有分析对象。</p>
        <p class="panel-hint">在亚马逊搜索结果页选中一个商品，或在下面输入 ASIN。</p>
      </section>

      <section id="object" class="panel-object" hidden>
        <section id="analysis" class="panel-analysis" hidden>
          <div class="panel-analysis-head">
            <div>
              <h2>AI 选品问答</h2>
              <p class="panel-hint">只根据当前 ASIN 的前台信息、已读取的 SellerSprite 数据和本小组研究记录回答。</p>
            </div>
            <button id="analysis-retry" type="button" hidden>重试</button>
          </div>
          <form id="analysis-form" class="panel-analysis-form">
            <label for="analysis-question">你想了解什么</label>
            <textarea id="analysis-question" name="question" rows="3" maxlength="1000" placeholder="例如：这个 ASIN 当前最需要关注哪些问题？"></textarea>
            <button id="analysis-ask" type="submit">让 AI 分析</button>
          </form>
          <p id="analysis-status" class="panel-analysis-status" role="status" hidden></p>
          <section id="analysis-answer" class="panel-analysis-answer" hidden>
            <p id="analysis-answer-question" class="panel-analysis-question"></p>
            <section class="panel-analysis-block">
              <h3>事实</h3>
              <ul id="analysis-facts" class="panel-analysis-list"></ul>
            </section>
            <section class="panel-analysis-block">
              <h3>结论与判断</h3>
              <ul id="analysis-inferences" class="panel-analysis-list"></ul>
            </section>
            <section class="panel-analysis-block">
              <h3>引用证据</h3>
              <ul id="analysis-citations" class="panel-analysis-list panel-analysis-citations"></ul>
            </section>
            <section id="analysis-views" class="panel-analysis-views"></section>
          </section>
        </section>

        <section id="drawer" class="panel-drawer">
          <button id="drawer-toggle" class="panel-drawer-toggle" type="button" aria-expanded="false" aria-controls="drawer-body">数据抽屉</button>
          <div id="drawer-body" class="panel-drawer-body" hidden>
            <div class="panel-drawer-sources">
              <p class="panel-hint">词位与评论在这里按需读取，读到的数据同时供上面的对话使用。</p>
              <div class="panel-drawer-source">
                <button id="load-positions" type="button">读取词位</button>
                <p id="positions-status" class="panel-drawer-status" role="status" hidden></p>
              </div>
              <div class="panel-drawer-source">
                <button id="load-reviews" type="button">读取评论</button>
                <p id="reviews-status" class="panel-drawer-status" role="status" hidden></p>
              </div>
            </div>

            <div id="drawer-views" class="panel-drawer-views"></div>

            <section id="record" class="panel-drawer-partition panel-record" hidden>
              <div class="panel-record-head">
                <h2>研究记录</h2>
                <span id="record-owner" class="panel-record-owner"></span>
              </div>
              <p id="record-note" class="panel-hint"></p>
              <form id="record-form" class="panel-record-form" hidden>
                <label for="record-summary">结论摘要</label>
                <textarea id="record-summary" name="summary" rows="3" maxlength="500" placeholder="例如：自然位只在前 3 页且大量依赖广告，先观察"></textarea>
                <label for="record-status">状态</label>
                <select id="record-status" name="status">
                  <option value="researching">研究中</option>
                  <option value="verified">已验证</option>
                  <option value="rejected">已否决</option>
                </select>
                <button id="record-submit" type="submit">保存研究记录</button>
                <p id="record-error" class="panel-error" role="alert" hidden></p>
              </form>
            </section>
          </div>
        </section>
      </section>

      <form id="manual" class="panel-manual">
        <label for="asin">输入 ASIN</label>
        <input id="asin" name="asin" type="text" maxlength="20" autocomplete="off" placeholder="例如 B07Z82895W" />
        <button id="submit" type="submit">分析</button>
        <p id="error" class="panel-error" role="alert" hidden></p>
      </form>
    </main>
  </body>
</html>
