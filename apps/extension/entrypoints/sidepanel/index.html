<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选品面板</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="panel">
      <header class="panel-head">
        <h1>选品面板</h1>
        <p id="source" class="panel-source"></p>
      </header>

      <section id="empty" class="panel-empty" hidden>
        <p>还没有分析对象。</p>
        <p class="panel-hint">在亚马逊搜索结果页选中一个商品，或在下面输入 ASIN。</p>
      </section>

      <section id="object" class="panel-object" hidden>
        <dl id="fields" class="panel-fields"></dl>

        <section class="panel-positions">
          <div class="panel-positions-head">
            <h2>词位情报</h2>
            <button id="load-positions" type="button">读取词位</button>
          </div>
          <p class="panel-hint">看它在每个关键词上的自然位与广告位，判断是靠自然出单还是靠广告撑着。</p>
          <p id="positions-status" class="panel-positions-status" role="status" hidden></p>
          <div id="positions-table-wrap" class="panel-table-wrap" hidden>
            <table class="panel-table">
              <thead>
                <tr>
                  <th scope="col">关键词</th>
                  <th scope="col">自然位</th>
                  <th scope="col">广告位</th>
                  <th scope="col">自然流量</th>
                  <th scope="col">广告流量</th>
                  <th scope="col">位置类型</th>
                </tr>
              </thead>
              <tbody id="positions-rows"></tbody>
            </table>
          </div>
        </section>
      </section>

      <form id="manual" class="panel-manual">
        <label for="asin">输入 ASIN</label>
        <input id="asin" name="asin" type="text" maxlength="20" autocomplete="off" placeholder="例如 B07Z82895W" />
        <button id="submit" type="submit">分析</button>
        <p id="error" class="panel-error" role="alert" hidden></p>
      </form>
    </main>
  </body>
</html>
